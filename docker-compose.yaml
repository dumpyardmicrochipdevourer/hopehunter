services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hhbot
      POSTGRES_USER: hhbot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hhbot -d hhbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # С диском: в redis лежат дневные счётчики откликов и список уже показанных вакансий.
    # Потерять их при рестарте - значит откликнуться сверх лимита и прислать всё по второму разу.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_ADMIN_USERNAMES: ${BOT_ADMIN_USERNAMES:-microchipdddd}
      DB_URL: jdbc:postgresql://db:5432/hhbot
      DB_USER: hhbot
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      HH_COOKIE_KEY: ${HH_COOKIE_KEY}
      # Публичный https-адрес мини-приложения; пусто - бот работает только кнопками в чате.
      BOT_WEBAPP_URL: ${BOT_WEBAPP_URL:-}
      # Без потолка JVM берёт четверть памяти хоста, а хост общий с другими сервисами.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx384m}
    ports:
      # Только на loopback: наружу приложение смотрит через обратный прокси с TLS. Telegram
      # открывает мини-приложения исключительно по https, так что голый порт всё равно бесполезен.
      - "127.0.0.1:${APP_PORT:-8080}:8080"

volumes:
  postgres_data:
  redis_data:
